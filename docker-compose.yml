services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weekly_reminder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weekly_reminder
    depends_on:
      - postgres

volumes:
  postgres-data:
